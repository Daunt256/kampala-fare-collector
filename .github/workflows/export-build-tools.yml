name: Export Android offline build kit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/export-build-tools.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install public Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Populate dependencies using only this public repository
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
      - name: Package public SDK, Gradle and dependency artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          import os,shutil,tarfile,hashlib
          from pathlib import Path
          kit=Path('android-offline-kit')
          kit.mkdir()
          sdk=Path(os.environ['ANDROID_HOME'])
          for relative in ['platforms/android-35','build-tools/35.0.0','licenses']:
              source=sdk/relative
              if source.exists():
                  shutil.copytree(source,kit/'sdk'/relative)
          gradle=Path(shutil.which('gradle')).resolve().parent.parent
          shutil.copytree(gradle,kit/'gradle')
          cache=Path(os.environ.get('GRADLE_USER_HOME',str(Path.home()/'.gradle')))/'caches'/'modules-2'
          allowed=[cache/'files-2.1',*cache.glob('metadata-2.*')]
          for source in allowed:
              if source.is_dir():
                  shutil.copytree(source,kit/'gradle-user-home'/'caches'/'modules-2'/source.name)
          (kit/'README.txt').write_text('Public Android SDK 35/build-tools 35.0.0, Gradle 8.9 and Maven dependency artifacts. No source recording, account credentials, Gradle settings, CI secrets, signing key or private app source is included. Use JDK 17 and retain the supplied SDK notices.\n')
          with tarfile.open('android-offline-kit.tar.gz','w:gz',compresslevel=3) as archive:
              archive.add(kit,arcname='android-offline-kit')
          path=Path('android-offline-kit.tar.gz')
          print('Archive bytes:',path.stat().st_size)
          print('SHA256:',hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Android-offline-build-kit
          path: android-offline-kit.tar.gz
          if-no-files-found: error
          retention-days: 7
